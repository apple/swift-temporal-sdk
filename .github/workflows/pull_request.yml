name: PR

permissions:
  contents: read

on:
  pull_request:
    types: [opened, reopened, synchronize]

jobs:
  soundness:
    name: Soundness
    uses: swiftlang/github-workflows/.github/workflows/soundness.yml@0.0.16
    with:
      license_header_check_project_name: "Swift Temporal SDK"
      api_breakage_check_enabled: false

  tests:
    name: Tests
    uses: swiftlang/github-workflows/.github/workflows/package_test.yml@main
    with:
      # The Temporal core artifacts are only built for Linux and Apple platforms.
      enable_windows: false
      enable_wasm_sdk_build: false
      enable_embedded_wasm_sdk_build: false
      enable_android_sdk_build: false
      enable_android_emulator_tests: false
      enable_freebsd: false
      linux_command: |
        Debug-Test: swift test -Xswiftc -require-explicit-sendable
        Release-Build: swift build -c release
      xcode_scheme: swift-temporal-sdk-Package
      # The macros are only built for the host architecture, so the tests can't
      # be built for the other slice of a universal macOS build.
      xcode_targets: |
        macOS: {build_destination: "platform=macOS,arch=arm64,variant=macos"}
        Catalyst: {}
        iOS: {}

  linkage-test-toolchains:
    name: Linkage test toolchains
    uses: swiftlang/github-workflows/.github/workflows/toolchain_matrix.yml@main

  linkage-test:
    name: Linkage test
    needs: linkage-test-toolchains
    uses: swiftlang/github-workflows/.github/workflows/execute_matrix.yml@main
    with:
      name: "Linkage test"
      matrix_yaml_string: ${{ needs.linkage-test-toolchains.outputs.matrix_yaml }}
      command: ./scripts/run-linkage-test.sh
