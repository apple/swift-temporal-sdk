name: PR

permissions:
  contents: read

on:
  pull_request:
    types: [opened, reopened, synchronize]

jobs:
  soundness:
    name: Soundness
    uses: swiftlang/github-workflows/.github/workflows/soundness.yml@0.0.15
    with:
      license_header_check_project_name: "Swift Temporal SDK"
      api_breakage_check_enabled: false

  unit-tests:
    name: Unit tests
    uses: apple/swift-nio/.github/workflows/unit_tests.yml@main
    with:
      linux_5_10_enabled: false
      linux_6_0_enabled: false
      linux_6_1_enabled: false
      linux_6_2_arguments_override: "-Xswiftc -require-explicit-sendable"
      linux_6_3_arguments_override: "-Xswiftc -require-explicit-sendable"
      linux_nightly_next_arguments_override: "-Xswiftc -require-explicit-sendable"
      linux_nightly_main_arguments_override: "-Xswiftc -require-explicit-sendable"

  macos-tests:
    name: macOS tests
    uses: apple/swift-nio/.github/workflows/macos_tests.yml@main
    with:
      runner_pool: general
      build_scheme: swift-temporal-sdk-Package
      swift_6_1_enabled: false
      watchos_xcode_build_enabled: false
      tvos_xcode_build_enabled: false
      visionos_xcode_build_enabled: false
    secrets: inherit

  static-sdk:
    name: Static Linux Swift SDK
    uses: apple/swift-nio/.github/workflows/static_sdk.yml@main

  cxx-interop:
    name: Cxx interop
    uses: apple/swift-nio/.github/workflows/cxx_interop.yml@main
    with:
      linux_5_10_enabled: false
      linux_6_0_enabled: false
      linux_6_1_enabled: false

  construct-linkage-test-matrix:
    name: Construct linkage test matrix
    runs-on: ubuntu-latest
    outputs:
      linkage-test-matrix: '${{ steps.generate-matrix.outputs.linkage-test-matrix }}'
    steps:
      - id: generate-matrix
        run: echo "linkage-test-matrix=$(curl -s https://raw.githubusercontent.com/apple/swift-nio/main/scripts/generate_matrix.sh | bash)" >> "$GITHUB_OUTPUT"
        env:
          MATRIX_LINUX_SETUP_COMMAND: apt-get update -y && apt-get install -yq jq && git config --global --add safe.directory /swift-temporal-sdk
          MATRIX_LINUX_COMMAND: ./scripts/run-linkage-test.sh
          MATRIX_LINUX_5_10_ENABLED: false
          MATRIX_LINUX_6_0_ENABLED: false
          MATRIX_LINUX_6_1_ENABLED: false
          MATRIX_LINUX_NIGHTLY_NEXT_ENABLED: false
          MATRIX_LINUX_NIGHTLY_MAIN_ENABLED: false

  linkage-test:
    name: Linkage test
    needs: construct-linkage-test-matrix
    uses: apple/swift-nio/.github/workflows/swift_test_matrix.yml@main
    with:
      name: "Linkage test"
      matrix_string: '${{ needs.construct-linkage-test-matrix.outputs.linkage-test-matrix }}'

  release-builds:
    name: Release builds
    uses: apple/swift-nio/.github/workflows/release_builds.yml@main
    with:
      linux_5_10_enabled: false
      linux_6_0_enabled: false
      linux_6_1_enabled: false
